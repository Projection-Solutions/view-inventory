<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inventory Viewer</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; }
        .controls { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 8px; }
        button { background: #28a745; color: white; border: none; padding: 8px 15px; cursor: pointer; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { text-align: left; padding: 10px; border-bottom: 1px solid #ddd; }
        th { background: #f8f9fa; }
        #status { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Inventory Viewer (Read-Only)</h2>
    <div class="controls">
        <input type="password" id="token" placeholder="Enter GitHub PAT">
        <button onclick="loadData()">Load Submissions</button>
    </div>
    <div id="status"></div>
    
    <table id="dataTable" style="display: none;">
        <thead>
            <tr>
                <th>Timestamp</th>
                <th>Item Name</th>
                <th>Category</th>
                <th>Notes</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

<script>
const REPO_OWNER = "Projection-Solutions";
const REPO_NAME = "data";
const FILE_PATH = "data.json";

async function loadData() {
    const token = document.getElementById('token').value.trim();
    const status = document.getElementById('status');
    const dataTable = document.getElementById('dataTable');
    const tableBody = document.getElementById('tableBody');

    if (!token) {
        status.textContent = 'Please enter your GitHub PAT.';
        return;
    }

    status.textContent = 'Loading data...';
    dataTable.style.display = 'none';

    const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`;
    const headers = {
        "Authorization": `Bearer ${token}`,
        "Accept": "application/vnd.github+json",
        "X-GitHub-Api-Version": "2022-11-28"
    };

    try {
        const res = await fetch(url, { headers });
        if (!res.ok) throw new Error('Failed to fetch data from GitHub.');

        const fileData = await res.json();
        
        // Decode GitHub's base64 file content safely
        const binary = atob(fileData.content.replace(/\s/g, ''));
        const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
        const jsonString = new TextDecoder().decode(bytes);
        const parsed = JSON.parse(jsonString);

        // Ensure items is strictly an array
        let items = Array.isArray(parsed) ? parsed : [];

        tableBody.innerHTML = '';
        if (items.length === 0) {
            status.textContent = 'No submissions found in data.json.';
            return;
        }

        items.sort((a, b) => new Date(b.timestamp || 0) - new Date(a.timestamp || 0));

        items.forEach(item => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${item.timestamp ? new Date(item.timestamp).toLocaleString() : 'N/A'}</td>
                <td><strong>${escapeHtml(item.name || '')}</strong></td>
                <td>${escapeHtml(item.category || '')}</td>
                <td>${escapeHtml(item.notes || '')}</td>
            `;
            tableBody.appendChild(row);
        });

        status.textContent = '';
        dataTable.style.display = 'table';
    } catch (err) {
        status.textContent = 'Error: ' + err.message;
    }
}

function escapeHtml(str) {
    return str.toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}
</script>

</body>
</html>
